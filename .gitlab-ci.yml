# Build, test and publish to GitLab Pages on every push to the default branch.
image: node:22

cache:
  key:
    files: [package-lock.json]
  paths: [.npm/]

stages: [test, deploy]

test:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:
  stage: deploy
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test
    - npm run build
  pages:
    publish: dist
  artifacts:
    paths: [dist]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
