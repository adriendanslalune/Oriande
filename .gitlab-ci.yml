# Tests run once per change, on its merge request; the default branch then only builds and
# publishes to GitLab Pages (what lands there was tested in its merge request). Pushes to other
# branches run nothing, to spare the CI minutes (asked by Adrien).
image: node:22

cache:
  key:
    files: [package-lock.json]
  paths: [.npm/]

stages: [test, deploy]

test:
  stage: test
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pages:
  stage: deploy
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  pages:
    publish: dist
  artifacts:
    paths: [dist]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
